name: AtliQ Grands Hospitality Metrics CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Run Hospitality Metrics Tests
      run: |
        python -m unittest tests/test_hospitality_metrics.py
